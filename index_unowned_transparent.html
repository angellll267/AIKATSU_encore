<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f5cff">
<link rel="manifest" href="manifest.json">
<title>アイカツ！アンコール カード管理</title>
<style>
:root{--p:#8f5cff;--p2:#ff75b8;--bg:#faf7ff;--card:#fff;--text:#332c3f;--muted:#887d95;--line:#eadff2}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#f7f0ff,#fff);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;background:#ffffffee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px 16px calc(10px + env(safe-area-inset-top))}
h1{font-size:19px;margin:0;font-weight:800}.sub{font-size:11px;color:var(--muted);margin-top:2px}
main{max-width:900px;margin:auto;padding:14px 14px 90px}
.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);background:white;border-radius:12px;padding:11px;color:var(--text)}
button{border:0;border-radius:12px;padding:11px 13px;font-weight:700;cursor:pointer}.primary{background:var(--p);color:white}.secondary{background:#f0e9ff;color:#6940a9}.pink{background:#ffe8f3;color:#b34278}.danger{background:#fff0f0;color:#c74444}
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.filters .wide{grid-column:1/-1}
.stats{display:flex;gap:8px;overflow:auto;margin:10px 0}.stat{min-width:120px;background:white;border:1px solid var(--line);border-radius:14px;padding:10px}.stat b{font-size:20px;display:block}.stat span{font-size:11px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.filters{grid-template-columns:repeat(4,1fr)}.toolbar{grid-template-columns:2fr 1fr 1fr}}
.card.unowned{opacity:.42;filter:saturate(.72)}.card.unowned:hover{opacity:.62}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 4px 16px #6c4a9010}.thumb{aspect-ratio:1/1.28;background:#f3edf8;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:cover}.noimg{font-size:12px;color:var(--muted)}.body{padding:10px}.name{font-weight:800;font-size:14px;line-height:1.35}.meta{font-size:11px;color:var(--muted);line-height:1.6;margin-top:4px}.count{display:flex;align-items:center;justify-content:space-between;margin-top:8px;background:#faf7ff;border-radius:10px;padding:5px}.count button{padding:5px 9px;border-radius:9px;background:white}.count strong{font-size:15px}.actions{display:flex;gap:6px;margin-top:7px}.actions button{flex:1;padding:7px;font-size:11px}
.empty{text-align:center;padding:55px 15px;color:var(--muted)}.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;font-size:28px;background:var(--p);color:white;box-shadow:0 8px 25px #5e35a555;z-index:6}
dialog{border:0;border-radius:20px;padding:0;width:min(92vw,520px);box-shadow:0 20px 70px #3b245055}dialog::backdrop{background:#21152c88}.dlg{padding:18px}.dlg h2{margin:0 0 12px;font-size:18px}.form{display:grid;gap:9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dlg-actions{display:flex;gap:8px;margin-top:14px}.dlg-actions button{flex:1}
.preview{width:100%;max-height:230px;object-fit:contain;border-radius:12px;background:#f5f0f8}.tiny{font-size:11px;color:var(--muted)}.settings-list{display:grid;gap:8px}.setting-row{display:flex;gap:7px;align-items:center}.setting-row input{flex:1}.pill{display:inline-block;background:#f0e9ff;color:#6940a9;padding:2px 7px;border-radius:99px;font-size:10px;margin:2px 2px 0 0}
</style>
</head>
<body>
<header><h1>🎀 アイカツ！アンコール カード管理</h1><div class="sub">カード図鑑は共有・所持枚数は自分だけのデータ</div></header>
<main>
  <div class="toolbar">
    <input id="q" placeholder="カード名・番号・メモを検索">
    <button class="secondary" onclick="openImport()">共有データを追加</button>
    <button class="secondary" onclick="openSettings()">⚙️ 設定</button>
  </div>
  <div class="filters">
    <select id="fBrand"><option value="">ブランド：すべて</option></select>
    <select id="fSet"><option value="">弾数：すべて</option></select>
    <select id="fRarity"><option value="">レアリティ：すべて</option></select>
    <select id="fType"><option value="">タイプ：すべて</option></select>
  </div>
  <div class="stats">
    <div class="stat"><b id="total">0</b><span>カード種類</span></div>
    <div class="stat"><b id="owned">0</b><span>所持種類</span></div>
    <div class="stat"><b id="copies">0</b><span>所持枚数</span></div>
    <div class="stat"><b id="rate">0%</b><span>コンプ率</span></div>
  </div>
  <div id="grid" class="grid"></div>
</main>
<button class="fab" onclick="openAdd()" aria-label="カードを追加">＋</button>

<dialog id="cardDlg"><div class="dlg">
<h2 id="dlgTitle">カード登録</h2>
<div class="form">
<input id="name" placeholder="カード名">
<div class="row"><select id="brand"></select><select id="set"></select></div>
<div class="row"><select id="rarity"></select><select id="type"></select></div>
<div class="row"><input id="number" placeholder="カード番号"><input id="count" type="number" min="0" value="0" placeholder="所持枚数"></div>
<textarea id="memo" rows="3" placeholder="メモ（任意）"></textarea>
<input id="image" type="file" accept="image/*">
<img id="preview" class="preview" hidden>
</div>
<div class="dlg-actions"><button class="secondary" onclick="cardDlg.close()">キャンセル</button><button class="primary" onclick="saveCard()">保存する</button></div>
</div></dialog>

<dialog id="importDlg"><div class="dlg">
<h2>📦 共有データを追加</h2>
<p class="tiny">友達から受け取った「カード図鑑データ」を読み込みます。カード情報だけが追加・更新され、あなたの所持枚数は変更しません。</p>
<input id="importFile" type="file" accept=".json,application/json">
<div class="dlg-actions"><button class="secondary" onclick="importDlg.close()">キャンセル</button><button class="primary" onclick="importCatalog()">読み込む</button></div>
</div></dialog>

<dialog id="settingsDlg"><div class="dlg">
<h2>⚙️ 設定・共有</h2>
<div class="settings-list">
<button class="secondary" onclick="exportCatalog()">📤 カード図鑑を共有用に書き出す</button>
<button class="secondary" onclick="exportBackup()">💾 自分の完全バックアップを書き出す</button>
<button class="secondary" onclick="document.getElementById('backupFile').click()">📥 完全バックアップを復元</button>
<input id="backupFile" type="file" accept=".json,application/json" hidden>
<button class="pink" onclick="openOptions()">選択肢（ブランド・弾数など）を編集</button>
</div>
<div class="tiny" style="margin-top:12px">共有用データには所持枚数を含めません。完全バックアップには所持枚数も含まれます。</div>
<div class="dlg-actions"><button class="primary" onclick="settingsDlg.close()">閉じる</button></div>
</div></dialog>

<dialog id="optionsDlg"><div class="dlg">
<h2>選択肢を編集</h2>
<div id="optionArea"></div>
<div class="dlg-actions"><button class="secondary" onclick="optionsDlg.close()">閉じる</button><button class="primary" onclick="saveOptions()">保存</button></div>
</div></dialog>

<script>
const DB='aikatsuEncoreV2', STORE='cards', OPT='options';
const defaults={
 brands:['Angely Sugar','Spicy Ageha','Futuring Girl','Aurora Fantasy','Swing ROCK','Love Moonrise','Bohemian Sky','その他'],
 sets:['第1弾','第2弾','第3弾','第4弾','第5弾','第6弾','第7弾','第8弾','プロモーション','その他'],
 rarities:['N','R','SR','PR','その他'],
 types:['キュート','クール','セクシー','ポップ','その他']
};
let db, editingId=null, editingImage=null, options=null;
const $=id=>document.getElementById(id);
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{r.result.createObjectStore(STORE,{keyPath:'id'});};r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
function tx(mode='readonly'){return db.transaction(STORE,mode).objectStore(STORE)}
function allCards(){return new Promise((res,rej)=>{let r=tx().getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function put(c){return new Promise((res,rej)=>{let r=tx('readwrite').put(c);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function del(id){return new Promise((res,rej)=>{let r=tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}
function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function getOptions(){try{return JSON.parse(localStorage.getItem(OPT))||defaults}catch{return defaults}}
function setOptions(o){options=o;localStorage.setItem(OPT,JSON.stringify(o))}
function fillSelect(id,vals,blank='選択してください'){let s=$(id);s.innerHTML='<option value="">'+blank+'</option>'+vals.map(x=>`<option>${esc(x)}</option>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function refreshSelects(){options=getOptions();fillSelect('brand',options.brands);fillSelect('set',options.sets);fillSelect('rarity',options.rarities);fillSelect('type',options.types);fillSelect('fBrand',options.brands,'ブランド：すべて');fillSelect('fSet',options.sets,'弾数：すべて');fillSelect('fRarity',options.rarities,'レアリティ：すべて');fillSelect('fType',options.types,'タイプ：すべて')}
async function render(){let cs=await allCards(), q=$('q').value.trim().toLowerCase();let fs={brand:$('fBrand').value,set:$('fSet').value,rarity:$('fRarity').value,type:$('fType').value};cs=cs.filter(c=>(!q||[c.name,c.number,c.memo].join(' ').toLowerCase().includes(q))&&(!fs.brand||c.brand===fs.brand)&&(!fs.set||c.set===fs.set)&&(!fs.rarity||c.rarity===fs.rarity)&&(!fs.type||c.type===fs.type));cs.sort((a,b)=>(a.set||'').localeCompare(b.set||'','ja')||(a.number||'').localeCompare(b.number||'','ja'));let all=await allCards();let owned=all.filter(c=>(+c.count||0)>0).length,copies=all.reduce((n,c)=>n+(+c.count||0),0);$('total').textContent=all.length;$('owned').textContent=owned;$('copies').textContent=copies;$('rate').textContent=(all.length?Math.round(owned/all.length*100):0)+'%';$('grid').innerHTML=cs.length?cs.map(cardHTML).join(''):`<div class="empty" style="grid-column:1/-1">カードがありません。<br>右下の＋から登録できます♩</div>`}
function cardHTML(c){return `<article class="card ${(+c.count||0)===0?"unowned":""}"><div class="thumb">${c.image?`<img src="${c.image}" alt="">`:'<span class="noimg">画像なし</span>'}</div><div class="body"><div class="name">${esc(c.name||'無題')}</div><div class="meta">${[c.brand,c.set,c.rarity,c.type,c.number].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join('')}</div><div class="count"><button onclick="changeCount('${c.id}',-1)">−</button><strong>${+c.count||0}枚</strong><button onclick="changeCount('${c.id}',1)">＋</button></div><div class="actions"><button class="secondary" onclick="editCard('${c.id}')">編集</button><button class="danger" onclick="removeCard('${c.id}')">削除</button></div></div></article>`}
async function changeCount(id,d){let c=(await allCards()).find(x=>x.id===id);if(!c)return;c.count=Math.max(0,(+c.count||0)+d);await put(c);render()}
function resetForm(){['name','number','memo'].forEach(x=>$(x).value='');['brand','set','rarity','type'].forEach(x=>$(x).value='');$('count').value=0;$('image').value='';$('preview').hidden=true;editingId=null;editingImage=null;$('dlgTitle').textContent='カード登録'}
function openAdd(){resetForm();cardDlg.showModal()}
async function editCard(id){let c=(await allCards()).find(x=>x.id===id);if(!c)return;editingId=id;editingImage=c.image||null;$('dlgTitle').textContent='カード編集';$('name').value=c.name||'';$('number').value=c.number||'';$('memo').value=c.memo||'';$('brand').value=c.brand||'';$('set').value=c.set||'';$('rarity').value=c.rarity||'';$('type').value=c.type||'';$('count').value=c.count||0;$('image').value='';if(c.image){$('preview').src=c.image;$('preview').hidden=false}else $('preview').hidden=true;cardDlg.showModal()}
$('image').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').hidden=false;editingImage=r.result};r.readAsDataURL(f)})
async function saveCard(){let name=$('name').value.trim();if(!name){alert('カード名を入力してください');return}let c={id:editingId||uid(),name,brand:$('brand').value,set:$('set').value,rarity:$('rarity').value,type:$('type').value,number:$('number').value.trim(),memo:$('memo').value.trim(),count:Math.max(0,+$('count').value||0),image:editingImage||null,updatedAt:Date.now()};await put(c);cardDlg.close();render()}
async function removeCard(id){if(confirm('このカードを削除しますか？')){await del(id);render()}}
function openImport(){importFile.value='';importDlg.showModal()}
async function importCatalog(){let f=$('importFile').files[0];if(!f)return alert('JSONファイルを選択してください');try{let d=JSON.parse(await f.text());if(d.kind!=='aikatsu-encore-catalog')throw Error();let current=await allCards();for(let x of d.cards||[]){let old=current.find(c=>c.id===x.id);await put({...x,count:old?.count||0})}importDlg.close();await render();alert('カード図鑑を追加しました！所持枚数はそのままです。')}catch(e){alert('共有データを読み込めませんでした。正しいカード図鑑JSONか確認してください。')}}
async function exportCatalog(){let cards=await allCards();let d={kind:'aikatsu-encore-catalog',version:2,createdAt:new Date().toISOString(),cards:cards.map(({count,...c})=>c)};download('aikatsu-encore-catalog.json',JSON.stringify(d));alert('共有用カード図鑑を書き出しました！')}
async function exportBackup(){let cards=await allCards();let d={kind:'aikatsu-encore-backup',version:2,createdAt:new Date().toISOString(),cards,options:getOptions()};download('aikatsu-encore-backup.json',JSON.stringify(d));alert('完全バックアップを書き出しました！')}
$('backupFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let d=JSON.parse(await f.text());if(d.kind!=='aikatsu-encore-backup')throw Error();for(let c of d.cards||[])await put(c);if(d.options)setOptions(d.options);refreshSelects();await render();alert('バックアップを復元しました！')}catch(e){alert('バックアップを読み込めませんでした。元データは削除していません。')}e.target.value=''})
function download(name,text){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function openSettings(){settingsDlg.showModal()}
function openOptions(){renderOptions();settingsDlg.close();optionsDlg.showModal()}
function renderOptions(){let groups=[['brands','ブランド'],['sets','弾数'],['rarities','レアリティ'],['types','タイプ']];$('optionArea').innerHTML=groups.map(([k,l])=>`<section><b>${l}</b><div id="op_${k}">${options[k].map((x,i)=>`<div class="setting-row"><input value="${esc(x)}" data-k="${k}" data-i="${i}"><button class="danger" onclick="this.parentElement.remove()">×</button></div>`).join('')}</div><button class="secondary" style="margin:6px 0 12px" onclick="addOpt('${k}')">＋追加</button></section>`).join('')}
function addOpt(k){let d=document.createElement('div');d.className='setting-row';d.innerHTML=`<input data-k="${k}" value=""><button class="danger" onclick="this.parentElement.remove()">×</button>`;$('op_'+k).appendChild(d)}
function saveOptions(){let o={};for(let k of ['brands','sets','rarities','types'])o[k]=[...document.querySelectorAll(`#op_${k} input`)].map(x=>x.value.trim()).filter(Boolean);setOptions(o);refreshSelects();optionsDlg.close()}
$('q').addEventListener('input',render);['fBrand','fSet','fRarity','fType'].forEach(id=>$(id).addEventListener('change',render));
(async()=>{options=getOptions();await openDB();
  // Safe migration: copy recognized old localStorage arrays into IndexedDB, without deleting old storage.
  for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);try{let v=JSON.parse(localStorage.getItem(k));if(Array.isArray(v)&&v.some(x=>x&&typeof x==='object'&&(x.name||x.cardName))){let existing=await allCards();for(let x of v){let c={id:x.id||uid(),name:x.name||x.cardName||'無題',brand:x.brand||'',set:x.set||x.series||'',rarity:x.rarity||'',type:x.type||'',number:x.number||x.cardNumber||'',memo:x.memo||'',count:+(x.count??x.ownedCount??0)||0,image:x.image||x.imageData||x.photo||null,updatedAt:Date.now()};if(!existing.some(e=>e.id===c.id))await put(c)}break}}catch{}}
  refreshSelects();render();
})();
</script>
</body>
</html>
